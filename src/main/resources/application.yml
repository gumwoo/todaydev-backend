spring:
  config:
    import: optional:file:./application-local.yml

  datasource:
    url: jdbc:postgresql://localhost:15432/todaydev
    username: todaydev
    password: todaydev

  r2dbc:
    url: r2dbc:postgresql://localhost:15432/todaydev
    username: todaydev
    password: todaydev

  flyway:
    url: jdbc:postgresql://localhost:15432/todaydev
    user: todaydev
    password: todaydev
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
  access-token-expiry: 1800
  refresh-token-expiry: 1209600

external:
  client:
    timeout-millis: 3000
    retry-max-attempts: 2
    retry-backoff-millis: 200
  github:
    token: ${GITHUB_PAT:}
    base-url: https://api.github.com
  hackernews:
    base-url: https://hacker-news.firebaseio.com/v0
  devto:
    base-url: https://dev.to/api
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: gemini-2.5-flash-lite

briefing:
  scoring:
    keyword-weight-multiplier: 10
    watched-repository-bonus: 30
    github-base-score: 20
    hacker-news-base-score: 15
    devto-base-score: 12
    recency-half-life-hours: 48
  collection:
    github-release-limit-per-repository: 5
    github-search-repository-limit-per-keyword: 3
    hacker-news-story-limit: 20
    devto-article-limit-per-keyword: 5
    candidate-concurrency: 8
  ai:
    summary-item-limit: 10

app:
  auth:
    refresh-cookie:
      secure: false
      http-only: true
      same-site: Lax
      path: /api/auth

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Trace-Id
    exposed-headers:
      - X-Trace-Id
    allow-credentials: true
    max-age: 3600

  redis:
    keys:
      refresh-token:
        prefix: refresh
        ttl-seconds: 1209600
      api-cache:
        prefix: api-cache
        ttl-seconds: 1800
      ai-summary-cache:
        prefix: ai-summary
        ttl-seconds: 86400
      progress-buffer:
        prefix: progress
        ttl-seconds: 600
      stream-token:
        prefix: stream-token
        ttl-seconds: 180
      briefing-in-progress:
        prefix: briefing-inprogress
        ttl-seconds: 600

logging:
  level:
    com.todaydev: DEBUG
    org.springframework.r2dbc: DEBUG

