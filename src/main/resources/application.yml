spring:
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/todaydev
    username: todaydev
    password: todaydev

  flyway:
    url: jdbc:postgresql://localhost:5432/todaydev
    user: todaydev
    password: todaydev
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  security:
    user:
      name: none

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
  access-token-expiry: 1800       # 30분 (초)
  refresh-token-expiry: 1209600   # 14일 (초)

external:
  github:
    token: ${GITHUB_PAT:}
    base-url: https://api.github.com
  hackernews:
    base-url: https://hacker-news.firebaseio.com/v0
  devto:
    base-url: https://dev.to/api
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com

logging:
  level:
    com.todaydev: DEBUG
    org.springframework.r2dbc: DEBUG
